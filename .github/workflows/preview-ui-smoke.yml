name: Isolated InnerMe Chat UI Smoke Test

on:
  push:
    branches: ["main"]
    paths:
      - "tests/preview-ui.spec.cjs"
      - ".github/workflows/preview-ui-smoke.yml"
      - "admin/**"
      - "admin-dashboard/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Verify streamed chat UI without provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated preview
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium for test execution only
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Serve preview on a local test-only URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preview-site"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/preview-site/innerme-chat-ui-preview"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/preview-site" > "$RUNNER_TEMP/preview-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/preview-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/innerme-chat-ui-preview/admin/ > /dev/null; then
              echo "Local isolated preview server is ready."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/preview-server.log"
          exit 1

      - name: Test local SSE simulation, rendering, copy, theme and mobile viewport
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/preview-ui.spec.cjs --reporter=line

      - name: Upload browser diagnostics when the test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: innerme-preview-browser-diagnostics
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/preview-server.log
          if-no-files-found: ignore
          retention-days: 5
